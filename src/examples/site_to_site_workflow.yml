---
description: >
  Example workflows demonstrating how to use the site to site connectivity
  orb on Linux (Docker) and Windows (machine) executors. After setup, use
  the built-in checkout step — SSH is routed through tunnel-proxy automatically.

usage:
  version: 2.1

  orbs:
    site-to-site-connectivity: cci-labs/site-to-site-connectivity@1.0.0

  jobs:
    build-with-private-repo-linux:
      docker:
        - image: cimg/base:current
      steps:
        - site-to-site-connectivity/setup
        - checkout
        - run:
            name: Build application
            command: |
              echo "Building application..."
        - site-to-site-connectivity/cleanup:
            when: always

    build-with-private-repo-windows:
      executor: site-to-site-connectivity/windows
      steps:
        - site-to-site-connectivity/setup
        - checkout
        - run:
            name: Build application
            command: |
              echo "Building application..."
        - site-to-site-connectivity/cleanup:
            when: always

    # Clone from a self-hosted GitLab (or Bitbucket Server, Gitea, …) that
    # lives behind the tunnel. CircleCI's built-in `- checkout` clones from
    # $CIRCLE_REPOSITORY_URL (the *public* VCS), so this job uses the orb's
    # `checkout` command to clone from the *internal* SSH host instead. The
    # internal host must be returned by tunnel-details so setup writes a
    # matching SSH ProxyCommand entry.
    build-with-internal-gitlab:
      docker:
        - image: cimg/base:current
      steps:
        - site-to-site-connectivity/setup
        - site-to-site-connectivity/checkout:
            git-url: "git@gitlab.internal.acme.com:org/payments-service.git"
        - run:
            name: Build application
            command: |
              cd ~/project
              echo "Building application..."
        - site-to-site-connectivity/cleanup:
            when: always

  workflows:
    private-repo-workflow:
      jobs:
        - build-with-private-repo-linux:
            context:
              - site-to-site-tunnel
        - build-with-private-repo-windows:
            context:
              - site-to-site-tunnel
        - build-with-internal-gitlab:
            context:
              - site-to-site-tunnel
